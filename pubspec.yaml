name: english_learning_app
description: EduApp - Ứng dụng học tập thông minh với AI

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.7

  # Gemini AI (gọi trực tiếp, không qua Cloud Functions)
  google_generative_ai: ^0.4.6

  # Auth
  google_sign_in: ^6.2.2

  # File & Document
  file_picker: ^8.1.2
  syncfusion_flutter_pdf: ^27.1.48

  # AI Features
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  record: ^6.0.0

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # Utils
  http: ^1.2.2
  intl: ^0.19.0
  uuid: ^4.5.1
  path: ^1.9.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env